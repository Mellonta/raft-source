name: Mellonta Enroot server release
on:
  push:
    branches: [main]
    paths:
      - 'scripts/mellonta/enroot*'
      - 'scripts/mellonta/setup-enroot.sh'
      - 'scripts/mellonta/prod-security-headers.conf'
      - 'scripts/mellonta/prod-smoke.py'
      - 'packages/server/**'
      - 'packages/web/**'
      - 'packages/shared/**'
      - 'packages/runtime-form/**'
      - 'packages/trace-client/**'
      - 'packages/sync-core/**'
      - 'packages/desktop-contract/**'
      - 'packages/visual-testing/shared/**'
      - 'manual/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - '.github/workflows/mellonta-enroot-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mellonta-enroot-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Mellonta/raft-source'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            deb_arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      RAFT_BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate configuration and lifecycle helpers
        run: |
          bash -n scripts/mellonta/setup-enroot.sh
          python3 scripts/mellonta/enroot.test.py
      - name: Prepare the disposable image builder
        run: |
          # Privileges are only for installing Enroot on this ephemeral CI host.
          # The deployed cluster setup is exercised as the unprivileged runner.
          curl -fsSL "https://github.com/NVIDIA/enroot/releases/download/v3.5.0/enroot_3.5.0-1_${{ matrix.deb_arch }}.deb" -o "$RUNNER_TEMP/enroot.deb"
          curl -fsSL "https://github.com/NVIDIA/enroot/releases/download/v3.5.0/enroot+caps_3.5.0-1_${{ matrix.deb_arch }}.deb" -o "$RUNNER_TEMP/enroot-caps.deb"
          sudo apt-get update -qq
          sudo apt-get install -y "$RUNNER_TEMP/enroot.deb" "$RUNNER_TEMP/enroot-caps.deb"
      - name: Build, verify Enroot deployment, and package the image
        shell: bash
        run: |
          set -E
          report_failure() {
            python3 - "$1" "$RUNNER_TEMP/enroot-check.log" <<'PY'
          import pathlib, re, sys
          output = pathlib.Path(sys.argv[2]).read_text(errors="replace")
          output = re.sub(r'postgresql://[^\s]+', '[database URL]', output)
          message = "Failed command: " + sys.argv[1] + "\n" + "\n".join(output.splitlines()[-45:])
          print("::error title=Enroot deployment failed::" + message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
          }
          exec > >(tee "$RUNNER_TEMP/enroot-check.log") 2>&1
          trap 'report_failure "$BASH_COMMAND"' ERR
          docker build --build-arg NODE_VERSION="$(cat .node-version)" --build-arg RELEASE_SHA="$GITHUB_SHA" \
            -f scripts/mellonta/enroot.Dockerfile -t mellonta-raft-enroot:ci .
          mkdir -p "$RUNNER_TEMP/enroot-release"
          enroot import --output "$RUNNER_TEMP/enroot-release/raft-server-linux-$RAFT_BUILD_ARCH.sqsh" dockerd://mellonta-raft-enroot:ci
          python3 - "$RUNNER_TEMP/enroot-release" "$GITHUB_SHA" <<'PY'
          import hashlib, json, os, pathlib, platform, sys
          root = pathlib.Path(sys.argv[1])
          arch = os.environ['RAFT_BUILD_ARCH']
          assert platform.machine() == {'x64': 'x86_64', 'arm64': 'aarch64'}[arch]
          image = root / f'raft-server-linux-{arch}.sqsh'
          sha = hashlib.sha256()
          with image.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024**2), b''): sha.update(chunk)
          manifest = 'enroot-manifest.json' if arch == 'x64' else 'enroot-manifest-linux-arm64.json'
          (root / manifest).write_text(json.dumps({
              'schema': 1, 'commit': sys.argv[2], 'image': image.name, 'sha256': sha.hexdigest(),
              'platform': f'linux-{arch}', 'enroot_minimum': '3.5.0', 'postgres_major': 16,
          }, indent=2) + '\n')
          PY
          python3 scripts/mellonta/enroot-smoke.py "$RUNNER_TEMP/enroot-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enroot-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/enroot-release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  release:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: enroot-linux-*
          path: enroot-release
          merge-multiple: true
      - name: Verify complete release artifacts
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('enroot-release')
          for arch in ['x64', 'arm64']:
              manifest = 'enroot-manifest.json' if arch == 'x64' else 'enroot-manifest-linux-arm64.json'
              meta = json.loads((root / manifest).read_text())
              assert meta['commit'] == os.environ['GITHUB_SHA'] and meta['platform'] == f'linux-{arch}'
              assert meta['image'] == f'raft-server-linux-{arch}.sqsh'
              sha = hashlib.sha256()
              with (root / meta['image']).open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024**2), b''): sha.update(chunk)
              assert sha.hexdigest() == meta['sha256']
          PY
      - name: Publish both verified server images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="enroot-server-$GITHUB_SHA"
          cat > "$RUNNER_TEMP/enroot-notes.md" <<'EOF'
          Prebuilt Raft production server for Enroot 3.5+ on Linux x86-64 and ARM64.
          Includes PostgreSQL 16, Redis, Node, and the production web build.
          Run scripts/mellonta/setup-enroot.sh --url YOUR_PORTAL_ORIGIN from the matching source checkout.
          Default deployment root: ~/park. Cluster setup requires no sudo or Docker.
          Use --foreground inside scheduler allocations. This server release is independent of Raft Computer releases.
          See MELLONTA.md for storage, ports, lifecycle commands, and update instructions.
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --draft --title "Raft Enroot server ${GITHUB_SHA:0:12}" --notes-file "$RUNNER_TEMP/enroot-notes.md"
          gh release upload "$tag" enroot-release/* LICENSE MELLONTA.md
          gh release edit "$tag" --draft=false --latest=false
