map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# A TLS reverse proxy may supply the original scheme. Other values are ignored.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
    http http;
}
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    include /etc/nginx/raft-security-headers.conf;

    # Resolve again after a server container is replaced; do not cache its old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://server:3001;
    location ~ ^/(api|internal|socket\.io|daemon|share)(/|$) {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location = /health {
        proxy_pass $api;
    }
    location /assets/ {
        include /etc/nginx/raft-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /desktop-manifest.json {
        include /etc/nginx/raft-security-headers.conf;
        default_type application/json;
        add_header Cache-Control "no-cache, must-revalidate" always;
        etag off;
        include /etc/nginx/desktop-manifest-etag.conf;
        try_files $uri =404;
    }
    location ~ /\. {
        deny all;
    }
    location / {
        include /etc/nginx/raft-security-headers.conf;
        add_header Cache-Control no-cache;
        try_files $uri $uri/ /index.html;
    }
}
