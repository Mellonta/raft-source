worker_processes 1;
pid @STATE@/run/nginx.pid;
error_log stderr warn;
daemon off;
events { worker_connections 1024; }
http {
    include @BUNDLE@/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path @STATE@/tmp/nginx-client;
    proxy_temp_path @STATE@/tmp/nginx-proxy;
    fastcgi_temp_path @STATE@/tmp/nginx-fastcgi;
    uwsgi_temp_path @STATE@/tmp/nginx-uwsgi;
    scgi_temp_path @STATE@/tmp/nginx-scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $forwarded_scheme { default $scheme; https https; http http; }
    server {
        listen @BIND@:@WEB_PORT@;
        server_name _;
        server_tokens off;
        root @APP@/packages/web/dist;
        index index.html;
        client_max_body_size 100m;
        include @BUNDLE@/security-headers.conf;
        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        location ~ ^/((api|internal|socket\.io|daemon|share|oidc)(/|$)|\.well-known/openid-configuration$) {
            proxy_pass http://127.0.0.1:@API_PORT@;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }
        location = /health { proxy_pass http://127.0.0.1:@API_PORT@; }
        location /assets/ {
            include @BUNDLE@/security-headers.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        location = /desktop-manifest.json {
            include @BUNDLE@/security-headers.conf;
            default_type application/json;
            add_header Cache-Control "no-cache, must-revalidate" always;
            etag off;
            add_header ETag '"sha256-@MANIFEST_SHA@"' always;
            try_files $uri =404;
        }
        location ~ /\. { deny all; }
        location / {
            include @BUNDLE@/security-headers.conf;
            add_header Cache-Control no-cache;
            try_files $uri $uri/ /index.html;
        }
    }
}
